name: WebMCP challenge CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: webmcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p tsconfig.ci.json --noEmit
      - run: npm run lint
      - name: Focused WebMCP tests
        run: >-
          npm test -- --run
          tests/webmcp-protocol.test.ts
          tests/webmcp-shelf-contract.test.ts
          tests/webmcp-storefront.test.ts
          tests/webmcp-preview-budget.test.ts
          tests/webmcp-buy-guard.test.ts
          tests/webmcp-mount-scope.test.ts
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
